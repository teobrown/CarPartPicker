name: scrape-27won

on:
  schedule:
    - cron: '0 7 * * 6'  # Saturdays 07:00 UTC (Mon=fcp, Tue=americanmuscle, Wed=rsd, Thu=prl, Fri=flyin-miata, Sat=27won)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install scraper deps
        run: uv sync --all-groups

      - name: Run scraper against 27WON Performance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m scraper 27won
