name: scrape-034motorsport

on:
  schedule:
    - cron: '0 11 * * 3'  # Wednesdays 11:00 UTC (4-hour offset from RallySport Direct's Wednesday 07:00 UTC slot — keeps the European-platform vendors paired on the same weekday with a 4h buffer between runs)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install scraper deps
        run: uv sync --all-groups

      - name: Run scraper against 034Motorsport
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m scraper 034motorsport
