name: scrape-iag-performance

on:
  schedule:
    - cron: '0 11 * * 1'  # Mondays 11:00 UTC (offset from FCP Euro's 07:00 UTC slot — every weekday now has a scrape but the times don't collide)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install scraper deps
        run: uv sync --all-groups

      - name: Run scraper against IAG Performance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m scraper iag-performance
